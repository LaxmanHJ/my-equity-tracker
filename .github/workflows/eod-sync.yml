# EOD data sync — runs the same pipeline as the dashboard's Force Sync button,
# but from the cloud so collection continues when the laptop is off.
#
# Primary purpose: keep the SIC-92 VRP gate counter advancing (iv_daily needs a
# row per trading day; Angel serves option greeks only around market hours) and
# keep delivery/sector/VIX/PCR tables fresh.
#
# Schedule (UTC crons, Mon-Fri; NSE market hours are 09:15-15:30 IST):
#   09:30 UTC = 15:00 IST — inside market hours: Angel PCR + optionGreek only
#               answer during them, so this run captures pcr_history + iv_daily
#   13:00 UTC = 18:30 IST — post-close: delivery/sector/VIX/FII publish in the
#               evening; this run gap-fills them and is the freshness gate
# The pipeline is idempotent (upserts + max(date) gap-fills), so running it
# twice a day is safe by construction.
#
# KNOWN RISK: NSE archive endpoints (delivery, sector indices, VIX) sometimes
# block datacenter IPs. Angel One and Turso calls are unaffected. If NSE
# sub-syncs fail here, they self-heal on the next localhost Force Sync /
# node-cron run (gap-fill works from each table's max(date)), and this run
# exits non-zero so the gap is visible as a red run — never silent.
#
# Required repository secrets:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN
#   ANGEL_API_KEY, ANGEL_TOTP_SECRET, ANGEL_CLIENT_ID, ANGEL_CLIENT_PIN
#   RAPIDAPI_KEY  (+ optionally ALPHAVANTAGE_KEYS, NEWS_API_KEY)

name: EOD data sync

on:
  schedule:
    - cron: '30 9 * * 1-5'  # 15:00 IST — market-hours run (PCR, IV chain)
    - cron: '0 13 * * 1-5'  # 18:30 IST — post-close run (EOD tables, freshness gate)
  workflow_dispatch: {} # manual trigger for catch-up runs

concurrency:
  group: eod-sync
  cancel-in-progress: false

permissions:
  contents: read # never writes to the repo; secrets are read from Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: quant_engine/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r quant_engine/requirements.txt

      - name: Start quant engine
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          # Output MUST be redirected to a file: a background process holding
          # the step's stdout pipe open makes the job hang until timeout.
          python -m uvicorn quant_engine.main:app --host 127.0.0.1 --port 5001 \
            > /tmp/quant-engine.log 2>&1 &
          echo $! > /tmp/quant-engine.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5001/health > /dev/null; then
              echo "quant engine up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "quant engine failed to start — log follows:"
          cat /tmp/quant-engine.log
          exit 1

      - name: Run sync worker
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
          ANGEL_CLIENT_PIN: ${{ secrets.ANGEL_CLIENT_PIN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          ALPHAVANTAGE_KEYS: ${{ secrets.ALPHAVANTAGE_KEYS }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          QUANT_ENGINE_URL: http://127.0.0.1:5001
        run: node scripts/syncWorker.js

      - name: Quant engine log
        if: always() # the engine's own errors are invisible otherwise
        run: cat /tmp/quant-engine.log || echo "(no log)"
