# CATALAN forward log — the scheduled collector + scorer.
#
# WHY THIS RUNS IN THE CLOUD: the forward log accrues exactly one day per
# calendar day and it is the only evidence that clears CATALAN's C2 ship gate
# (Claude's training cutoffs fall inside the historical corpus, so backfilled
# scores measure recall, not prediction). A day this does not run is a
# permanently lost observation. It cannot depend on a laptop being awake.
#
# WHY IT COMMITS DATA BACK: Actions runners are ephemeral and Turso writes are
# blocked repo-wide (free-tier quota exhausted 2026-08-05), so there is nowhere
# else to put the corpus. The committed NDJSON under catalan/data/forward_log/
# is the system of record; catalan.db is a rebuildable local cache.
#
# The commit timestamps are the point, not a side effect: they are independent,
# tamper-evident proof that each headline was recorded BEFORE the return it
# predicts was known. The pre-registration's contamination argument rests on it.
#
# Required repository secret:
#   GEMINI_API_KEY      — scoring (catalan-v2 scores with gemini-3.5-flash-lite).
#                         Without it the run still collects and extracts PDF
#                         text; scoring is skipped and backfilled later from the
#                         stored headlines.
# Optional:
#   ANTHROPIC_API_KEY   — only if CATALAN_MODEL is set to a Claude model.
# Optional:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN — read-only. The buy list uses them for
#                         the point-in-time NIFTY500 roster; without them the
#                         list says so and collection is unaffected.

name: CATALAN forward log

on:
  schedule:
    # 01:07 UTC = 06:37 IST, EVERY day. Collects the PREVIOUS calendar day, so a
    # Tuesday run captures Monday's post-close filings and a Saturday run
    # captures Friday's. NSE announcements keep landing until ~23:59 IST
    # (observed: the latest row on 2026-08-07 was 23:57), so anything earlier
    # than midnight IST would truncate the day.
    #
    # WHY ALL SEVEN DAYS and not Tue-Sat: a Tue-Sat schedule collects Mon-Fri
    # filings only, so Saturday and Sunday filings were never collected at all.
    # They are not sparse — Saturday 2026-08-08 carried 480 announcements, 37%
    # of the preceding Friday's 1,286, and survived only because that day was
    # dispatched by hand. Weekend filings are also the ones most likely to be a
    # biased subset (news released when the market cannot react), which is
    # exactly the population a news-reaction study must not silently drop.
    # `attribution_date()` already maps them onto the next trading day's open.
    #
    # WHY 01:07 UTC (moved from 03:45 on 2026-09-29): scheduled runs have landed
    # 4-5 hours late (08:00-09:00 UTC, i.e. after the 09:15 IST open), and
    # GitHub delays top-of-hour schedules most. An earlier, off-the-hour start
    # gives the day's buy list a chance to exist before the open. The previous
    # IST day is complete by 18:30 UTC, so starting earlier truncates nothing.
    - cron: "7 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to collect (YYYY-MM-DD). Blank = yesterday."
        required: false
      skip_score:
        description: "Collect only, no Anthropic calls"
        type: boolean
        default: false

concurrency:
  # Never let a manual catch-up race the nightly run — both commit to the
  # same branch and a mid-run push would conflict.
  group: catalan-forward-log
  cancel-in-progress: false

# Required for the archive commit. Without this the default GITHUB_TOKEN is
# read-only on many repos and the push step fails.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Pinned to the branch CATALAN lives on. Update both of these together if
    # the project is ever merged to main.
    env:
      CATALAN_BRANCH: r2-nifty500-gate

    steps:
      - uses: actions/checkout@v4
        with:
          ref: r2-nifty500-gate
          # A token with write access is what lets the commit step push back.
          persist-credentials: true
          # Full history: the retry path rebases, and rebase on the default
          # shallow (depth 1) clone fails.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CATALAN dependencies
        run: python -m pip install -r catalan/requirements.txt

      - name: Run pipeline (rebuild → collect → PDF text → score both arms → archive → buy list)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="--date ${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.skip_score }}" = "true" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::scoring skipped — headlines still collected"
            ARGS="$ARGS --skip-score"
          fi
          # The result goes to its own file: anything a library prints to
          # stdout must never corrupt the JSON the health checks parse.
          python -m catalan.pipeline $ARGS --result-file "$RUNNER_TEMP/pipeline_result.json"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### CATALAN forward log"
            echo '```json'
            cat "$RUNNER_TEMP/pipeline_result.json" 2>/dev/null || echo "pipeline produced no output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Surface a scoring outage as a red annotation WITHOUT failing the job.
      #
      # Collection is the irreplaceable half — a lost day is permanent, whereas
      # scoring can always be redone from the stored headlines. So this must
      # never exit non-zero, or a billing problem would start costing us
      # corpus. It only has to be impossible to miss.
      #
      # Why it exists: between 2026-08-11 and 08-17 the Anthropic credit
      # balance ran out, API failures were silently recorded as completed
      # scores, and the job reported success every day at up to 100% failure.
      - name: Flag scoring failures
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pipeline_result.json"
          try:
              result = json.loads(p.read_text())
          except Exception:
              print("::warning::could not read pipeline result to check scoring health")
              raise SystemExit(0)
          for key, arm in (("score", "headline arm"), ("score_pdf", "PDF arm")):
              score = result.get(key) or {}
              if score.get("skipped"):
                  continue
              failed, attempted = score.get("api_failed", 0), score.get("pending", 0)
              if failed:
                  pct = 100.0 * failed / attempted if attempted else 100.0
                  print(f"::error::{arm}: {failed}/{attempted} ({pct:.1f}%) scoring API calls "
                        "FAILED. Headlines were still collected and are safe; these "
                        "announcements remain pending and will be retried. Check the "
                        "Anthropic credit balance first — the cause on 2026-08-14/17 and "
                        "again from 2026-09-11.")
              if score.get("parse_missed"):
                  print(f"::warning::{arm}: {score['parse_missed']} responses carried no "
                        "readable verdict. Try `--reparse` before re-scoring; it costs nothing.")
              if score.get("quota_deferred"):
                  print(f"::warning::{arm}: free-tier daily quota spent; "
                        f"{score['quota_deferred']} announcements deferred to the next run.")
          pdf = result.get("pdf_text") or {}
          if pdf.get("fetch_failed"):
              print(f"::warning::{pdf['fetch_failed']} PDF downloads failed; they stay "
                    "pending and are retried on the next run.")
          PY

      - name: Commit the archive
        # Collected data must be committed even if an earlier check step failed.
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "catalan-bot"
          git config user.email "catalan-bot@users.noreply.github.com"
          git add catalan/data/forward_log/

          # GUARD: "git staged nothing" has two causes and only one is benign.
          #
          # Benign — the day was already collected and committed, so a re-run
          # is idempotent and there is genuinely nothing new.
          #
          # CATASTROPHIC — the archive is invisible to git (a .gitignore rule,
          # a bad path) so `git add` silently staged nothing. This runner is
          # ephemeral and Turso writes are quota-blocked, so git is the only
          # durable destination: exiting 0 here destroys the day's collection
          # and reports success. That happened on 2026-08-19, when
          # catalan/data/forward_log/ was added to .gitignore.
          #
          # Distinguish them by asking whether git tracks the archive at all.
          if [ -z "$(git ls-files catalan/data/forward_log/)" ]; then
            echo "::error::catalan/data/forward_log/ is NOT TRACKED by git. The archive is the system of record and this runner is about to be destroyed with the day's collection on it. Check .gitignore — the directory must stay tracked."
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "no new rows — nothing to commit"
            exit 0
          fi

          # COMMIT FIRST, THEN REBASE. `git rebase` refuses to run against a
          # dirty index, so staging the archive and *then* pulling fails with
          # "cannot pull with rebase: Your index contains uncommitted changes"
          # (this is what broke the 2026-08-11 run). Stashing instead of
          # committing would be worse than the bug: the stash is never popped,
          # so the run goes green having committed nothing and the day's rows
          # are gone with the runner.
          git commit -m "data(catalan): forward log $(date -u +%Y-%m-%d)"

          # Fast path: nobody else pushed, so no rebase is needed at all. Only
          # if the push is rejected do we rebase our commit onto theirs and
          # retry — the archive is append-only, so a rebase cannot lose rows.
          if ! git push origin HEAD:"$CATALAN_BRANCH"; then
            echo "push rejected — rebasing onto the newer tip and retrying"
            git pull --rebase origin "$CATALAN_BRANCH"
            git push origin HEAD:"$CATALAN_BRANCH"
          fi

      - name: Fail loudly if nothing was collected
        run: |
          # A silently-dead collector is this study's main failure mode, so a
          # zero-row day must be a red run rather than a green no-op. NSE
          # publishes announcements on non-trading days too (they are just
          # sparse), so zero really does mean something broke.
          python - <<'PY'
          import json, os, sys
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/pipeline_result.json"))
          fetched = r.get("collect", {}).get("fetched", 0)
          print(json.dumps(r, indent=2))
          if fetched == 0:
              sys.exit("collector fetched 0 rows for %s — investigate" % r.get("date"))
          PY

      # AFTER the commit, so a red run can never cost collected data. Until
      # 2026-09-29 a scoring outage only produced an annotation on a green run,
      # and the 2026-09-11 credit outage went unnoticed for 16 days. A red run
      # triggers GitHub's failure email.
      - name: Fail the run if scoring failed
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pipeline_result.json"
          try:
              result = json.loads(p.read_text())
          except Exception:
              sys.exit("pipeline produced no result — investigate")
          errors = {k: v["error"] for k, v in result.items() if isinstance(v, dict) and "error" in v}
          if errors:
              sys.exit(f"pipeline stages failed: {errors}. Headlines are committed; fix and re-run.")
          pdf = result.get("pdf_text") or {}
          if pdf.get("extract_error"):
              sys.exit(f"{pdf['extract_error']} attachments crashed the PDF extractor — a bug, not "
                       "a document fact. Data is committed; investigate.")
          # Ten or more, so a quiet day holding a few permanently dead links is not an alarm.
          if pdf.get("pending", 0) >= 10 and pdf.get("fetch_failed", 0) >= pdf.get("pending", 0):
              sys.exit("every PDF download failed this run — the PDF arm (the primary endpoint) "
                       "is silently becoming 100% headline fallback. Data is committed; investigate.")
          for k in ("score_pdf", "score"):
              sc = result.get(k) or {}
              attempted = sc.get("pending", 0) - sc.get("quota_deferred", 0)
              if attempted >= 10 and sc.get("parse_missed", 0) > 0.2 * attempted:
                  # A sudden wave of unreadable answers is how a silent model
                  # change under the same name would first show (verifier G1).
                  sys.exit(f"{k}: {sc['parse_missed']}/{attempted} answers had no readable verdict. "
                           "Data is committed; check for a silent model change.")
          failed = sum((result.get(k) or {}).get("api_failed", 0) for k in ("score", "score_pdf"))
          attempted = sum((result.get(k) or {}).get("pending", 0) - (result.get(k) or {}).get("quota_deferred", 0)
                          for k in ("score", "score_pdf"))
          # One stubborn filing failing every day is not an outage; five or more
          # failures, or a tenth of the attempts, is.
          if failed >= 5 or (attempted and failed > 0.1 * attempted):
              sys.exit(f"{failed} scoring API calls failed (see the annotations). Data is committed; "
                       "top up credits and re-run, or let tomorrow's run retry them.")
          PY
